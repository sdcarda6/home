<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIN KUGO</title>
    <style>
        :root {
            --bg-color: #f7f2ea;
            --surface-color: #fffaf5;
            --surface-hover: #fffdef;
            --text-main: #4a3b32;
            --text-secondary: #8c786d;
            --border-color: #e6dcce;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        .bold-title {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .bold-title .main-name {
            color: #d97757;
            margin-right: 12px;
        }

        .bold-title .sub-name {
            color: #335c67;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-top: 15px;
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .category-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        /* Gemini 流光炫彩特效的卡片外层容器 */
        .card-wrapper {
            position: relative;
            border-radius: 18px;
            padding: 2px;
            background: transparent;
            transition: all 0.3s ease;
        }

        .card-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 20px;
            background: conic-gradient(from 0deg at 50% 50%, #4285F4, #EA4335, #FBBC05, #34A853, #9b51e0, #4285F4);
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s ease;
            filter: blur(8px);
        }

        .card-wrapper:hover::before {
            opacity: 1;
            animation: rotateGlow 3s linear infinite;
        }

        @keyframes rotateGlow {
            0% { filter: blur(8px) hue-rotate(0deg); }
            100% { filter: blur(8px) hue-rotate(360deg); }
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card-wrapper:hover .card {
            background-color: var(--surface-hover);
            transform: translateY(-3px);
            border-color: transparent;
        }

        .card h3 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .card p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        footer {
            margin-top: auto;
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="bold-title">
            <span class="main-name">MIN</span>

            </div>

            <!-- 第5个卡片 -->

</body>
</html>
